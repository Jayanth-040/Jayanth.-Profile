
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #312e81);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile {
            width: 100%;
            max-width: 380px;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px #0005;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #818cf8;
            object-fit: cover;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .role {
            color: #a5b4fc;
            margin-bottom: 20px;
        }

        .info {
            text-align: left;
            line-height: 2.2;
            margin: 20px 0;
        }

        .skills span {
            display: inline-block;
            background: #3730a3;
            padding: 7px 12px;
            border-radius: 20px;
            margin: 4px;
            font-size: 13px;
        }

        .contact {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #818cf8;
            color: #101827;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
        }

        .contact:hover {
            background: white;
        }
    </style>
</head>

<body>

    <div class="profile">

        <img class="avatar"
             src="https://placehold.co/200x200/312e81/ffffff?text=ME"
             alt="My profile photo">

        <h1>Your Name</h1>
        <p class="role">Student | Future Developer</p>

        <hr>

        <div class="info">
            <p><strong>🎂 Age:</strong> Your age</p>
            <p><strong>🎓 Course:</strong> Diploma CSE</p>
            <p><strong>📍 City:</strong> Your city</p>
            <p><strong>🎯 Hobby:</strong> Coding</p>
        </div>

        <h3>My Skills</h3>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Python</span>
            <span>C Programming</span>
        </div>

        <p style="margin-top: 20px; color: #cbd5e1;">
            Learning today, building tomorrow 🚀
        </p>

        <a class="contact" href="mailto:forcsepurpose040@gmail.com">
            Contact Me
        </a>

    </div>

</body>
</html>
